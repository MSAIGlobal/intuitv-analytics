# Cyber Essentials / Secure Configuration: GitHub CodeQL static analysis.
# Requires GitHub code scanning (Advanced Security) enabled on the repo.
# Runs on the default branch and weekly so pull-request checks stay driven
# by the portable security-scan workflow (Semgrep + gitleaks).
name: CodeQL
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
      - name: Analyze
        uses: github/codeql-action/analyze@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
        with:
          category: "/language:${{ matrix.language }}"
